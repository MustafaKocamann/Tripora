[project]
name = "tripora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "lefthook>=2.2.2",
    "nbformat>=5.11.1",
    "openai>=3.35.1",
    "openrouter>=0.10.8",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.4",
]

[tool.pytest.ini_options]
cache_dir = "backend/.pytest_cache"
addopts = "--basetemp=backend/.pytest-tmp"
